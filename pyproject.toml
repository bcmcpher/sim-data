[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "ghibli"
version = "0.1.0"
description = "GHIBLI: Generative Harmonization & Imaging Benchmark Library for IQMs"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26.0",
    "scipy>=1.11.0",
    "nibabel>=5.2.0",
    "dipy>=1.9.0",
    "SimpleITK>=2.3.0",
    "torchio>=0.20.0",
    "monai>=1.4.0",
    "pydantic>=2.6.0",
    "pyyaml>=6.0.1",
    "pandas>=2.1.0",
    "scikit-image>=0.22.0",
    "scikit-learn>=1.4.0",
    "matplotlib>=3.8.0",
    "Pillow>=10.0.0",
    "joblib>=1.3.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
]

[project.optional-dependencies]
cpu = [
    "torch>=2.7.0",
]
cu128 = [
    "torch>=2.7.0",
]
harmonization = [
    "combatlearn>=2.0.0",
]

[dependency-groups]
dev = [
    "mypy>=1.11.0",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "types-PyYAML>=6.0.12",
]

[project.scripts]
ghibli = "ghibli.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/ghibli"]

[tool.uv]
conflicts = [
    [{ extra = "cpu" }, { extra = "cu128" }],
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [
    { extra = "cpu", index = "pytorch-cpu" },
    { extra = "cu128", index = "pytorch-cu128" },
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.10"
mypy_path = "src"
packages = ["ghibli"]
plugins = ["pydantic.mypy"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = [
    "nibabel.*",
    "dipy.*",
    "SimpleITK.*",
    "scipy.*",
    "skimage.*",
    "sklearn.*",
    "torchio.*",
    "monai.*",
    "joblib.*",
    "combatlearn.*",
    "pandas.*",
    "matplotlib.*",
]
ignore_missing_imports = true
