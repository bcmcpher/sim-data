[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "sim-data"
version = "0.1.0"
description = "Physics-ordered multimodal MRI artifact and multi-site effect simulator for visual & automated QC"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26.0",
    "scipy>=1.11.0",
    "nibabel>=5.2.0",
    "torchio>=0.20.0",
    "monai>=1.4.0",
    "pydantic>=2.6.0",
    "pyyaml>=6.0.1",
    "pandas>=2.1.0",
    "pyarrow>=15.0.0",
    "scikit-image>=0.22.0",
    "scikit-learn>=1.4.0",
    "matplotlib>=3.8.0",
    "Pillow>=10.0.0",
    "joblib>=1.3.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
]

[project.optional-dependencies]
cpu = [
    "torch>=2.7.0",
]
cu128 = [
    "torch>=2.7.0",
]
harmonization = [
    "combatlearn>=0.1.0",
    "neuroCombat>=0.2.12",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
]

[project.scripts]
sim-data = "sim_data.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/sim_data"]

[tool.uv]
conflicts = [
    [{ extra = "cpu" }, { extra = "cu128" }],
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [
    { extra = "cpu", index = "pytorch-cpu" },
    { extra = "cu128", index = "pytorch-cu128" },
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"
